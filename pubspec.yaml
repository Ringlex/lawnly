name: lawnly
description: "Pielęgnacja trawnika: zabiegi planowane pod prognozę pogody."
publish_to: 'none'

version: 1.0.0+2

# Flutter 3.41.0 / Dart 3.11.0 (patrz .fvmrc)
environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Stan i wstrzykiwanie
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  get_it: ^9.2.1
  go_router: ^17.5.0

  # Model i wynik
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  fpdart: ^1.1.0
  collection: ^1.18.0

  # Dane
  shared_preferences: ^2.2.2

  # Pogoda: MET Norway (bez klucza API, wymaga User-Agent), lokalizacja i opady historyczne: Open-Meteo
  http: ^1.2.0
  geolocator: ^14.0.2

  # UI
  adaptive_theme: ^3.4.1
  google_fonts: ^8.2.1
  intl: any
  logging: ^1.3.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  animations: ^2.2.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  file_picker: ^13.4.1
  archive: ^4.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  build_runner: ^2.4.7
  freezed: ^3.2.5
  json_serializable: ^6.6.0
  mocktail: ^1.0.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  generate: true
